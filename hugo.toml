baseURL = 'https://institutocambacica.com'
languageCode = 'pt-br'
title = 'Instituto Cambacica de Audiência'
theme = 'typo'

[params]
  description = 'Este site mostra dados de comparação de audiência entre os principais canais do Youtube'
  author = 'Instituto Cambacica de Audiência'
  homeCollection = 'posts'
  homeCollectionTitle = 'Posts Recentes'
  #homeIntroTitle = 'Instituto Cambacica de Audiência'
  homeIntroContent = 'Aqui você não só se informa. Você verifica a audiência.'
  paginationSize = 10
  
  [[params.menu]]
    name = 'campeonatos'
    url = '/campeonatos/'

  [[params.menu]]
    name = 'sobre'
    url = '/sobre/'
  
  [[params.menu]]
    name = 'github'
    url = 'https://github.com/institutocambacica'
    newTab = true

[module]
  # layouts/campeonatos/{taxonomy,term}.html e layouts/index.json usam o sistema
  # de layouts reescrito na 0.146. Num binário anterior o site construiria, mas
  # com as páginas erradas — melhor falhar na cara.
  [module.hugoVersion]
    min = '0.146.0'

[taxonomies]
  tag = 'tags'
  category = 'categories'
  # Chave singular = nome da taxonomia; o plural é a chave usada no frontmatter.
  # Os termos são ASCII ('Brasileirao 2026'); o nome bonito e acentuado fica no
  # title de content/campeonatos/<slug>/_index.md. Ver layouts/campeonatos/.
  campeonato = 'campeonatos'

[outputs]
  # HTML precisa vir primeiro: é ele que define o permalink canônico da home.
  # RSS precisa estar listado explicitamente, senão declarar este bloco derruba
  # o feed. JSON é o índice de busca, renderizado por layouts/index.json.
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
